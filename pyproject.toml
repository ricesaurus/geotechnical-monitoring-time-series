[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geotech-timeseries"
version = "0.1.0"
description = "Reproducible time-series analysis of USGS landslide monitoring data from Cleveland Corral, California"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Project Author" }]
dependencies = [
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.2,<5",
  "matplotlib>=3.9,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "pyarrow>=17,<30",
  "requests>=2.32,<3",
  "ruptures>=1.1.9,<2",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "seaborn>=0.13,<1",
  "statsmodels>=0.14.4,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
